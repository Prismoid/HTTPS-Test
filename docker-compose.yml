services:
  hello-server:
    build: .
    expose:
      - "10250"

  caddy:
    image: caddy:2.11.4-alpine
    depends_on:
      - hello-server
    ports:
      - "10250:10250"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - ./certs/clients:/etc/caddy/certs/clients:ro